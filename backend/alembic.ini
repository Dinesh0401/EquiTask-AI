[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by EQUITASK_DATABASE_URL env var)
sqlalchemy.url = sqlite:///./equitask.db

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
timezone = UTC

# max length of characters to apply to the
# "version code" column
max_varchar_length =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#post-write-hooks
# for more details

hooks =

# type and reference of post write hook
# type = console_scripts
# reference = mymodule.function

# example: run black on new migration files
# hooks = black
# black.type = console_scripts
# black.reference = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S
