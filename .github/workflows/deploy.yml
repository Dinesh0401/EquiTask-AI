name: CD

on:
  push:
    branches: [master]

jobs:
  # ------------------------------------------------------------------
  # Build the backend image, scan it, and push to GHCR.
  # ------------------------------------------------------------------
  build-and-scan:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/equitask-backend
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container image security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
        # NOTE: trivy-action@master is unpinned intentionally here; pin to a
        # release tag and triage the baseline before production use.

  # ------------------------------------------------------------------
  # Staging deployment (placeholder — no real cluster is wired yet).
  # ------------------------------------------------------------------
  deploy-staging:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - run: "echo 'Would deploy image ${{ needs.build-and-scan.outputs.image-tag }} to staging'"
      - run: "echo 'Placeholder: apply Helm/Kubernetes manifests, run smoke tests against /health here.'"

  # ------------------------------------------------------------------
  # Production deployment — manual approval gate.
  # ------------------------------------------------------------------
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    steps:
      - run: echo "Production deployment requires manual approval via the GitHub 'production' environment protection rules."
      - run: "echo 'Placeholder: would promote the staging image to production; not wired to a real cluster.'"
